<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cronómetro de Lectura</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#121318">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121318;
      --card-bg: #1a1b23;
      --accent-green: #00ff88;
      --accent-btn: #19d98b;
      --accent-gain: #7dffc4;
      --accent-red: #ff4757;
      --accent-amber: #ffb020;
      --text-primary: #e1e2e6;
      --text-secondary: #9a9dab;
      --input-bg: #242632;
      --border-color: #2e3142;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
      font-variant-numeric: tabular-nums;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 18px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .header-title { text-align: center; font-size: 0.85rem; letter-spacing: 2px; color: var(--text-secondary); font-weight: 700; margin-bottom: 18px; }
    .selector-label { font-size: 0.78rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; letter-spacing: 1px; }

    .book-selector-container {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    select, input { width: 100%; background-color: transparent; color: var(--text-primary); border: none; outline: none; font-size: 1rem; font-weight: 600; }
    select:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; border-radius: 6px; }
    select:disabled { opacity: 0.65; cursor: not-allowed; }
    select option { background-color: var(--card-bg); color: var(--text-primary); }
    .text-input { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; font-size: 1rem; margin-top: 6px; color: #ffffff; }
    .text-input:focus { border-color: var(--accent-green); }
    .progress-container { margin-top: 6px; }
    .progress-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
    .progress-bar-bg { position: relative; width: 100%; height: 8px; background-color: rgba(255, 255, 255, 0.08); border-radius: 6px; overflow: hidden; }
    .progress-bar-fill, .progress-bar-gain { position: absolute; top: 0; height: 100%; transition: width 0.4s ease, left 0.4s ease; }
    .progress-bar-fill { left: 0; width: 0%; background-color: var(--accent-green); }
    .progress-bar-gain { left: 0; width: 0%; background-color: var(--accent-gain); opacity: 0.55; }
    .progress-pill { background-color: rgba(0, 255, 136, 0.12); color: var(--accent-green); padding: 2px 8px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; }

    .ring {
      position: relative;
      padding: 3px;
      border-radius: 21px;
      margin-bottom: 14px;
      background: var(--border-color);
      transition: padding 0.25s ease, margin 0.25s ease;
    }
    /* al correr, el anillo se engrosa hacia afuera (sin mover el contenido) */
    .ring.running { padding: 5px; margin: -2px -2px 12px; border-radius: 23px; animation: pulso 2.4s ease-in-out infinite; }
    .ring.meta-ok { box-shadow: 0 0 22px rgba(0, 255, 136, 0.22); }
    /* el anillo es una barra de progreso dibujada sobre el borde; en la punta se ensancha */
    .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
    .ring-svg path { fill: none; stroke-linecap: butt; transition: stroke-dasharray 0.8s linear, stroke-dashoffset 0.8s linear, stroke-width 0.25s ease; }
    .ring-svg path.rb { stroke-linecap: round; }
    .ring-svg.sin-anim path { transition: none; }
    #rTrack { stroke: var(--border-color); }
    .timer-meta { margin-top: 10px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.5px; color: var(--text-secondary); }
    .timer-meta.ok { color: var(--accent-green); }
    .timer-display { background-color: #111216; border-radius: 18px; padding: 20px 12px; text-align: center; }
    @keyframes pulso {
      0%, 100% { box-shadow: 0 0 0 rgba(0, 255, 136, 0); }
      50% { box-shadow: 0 0 24px rgba(0, 255, 136, 0.18); }
    }
    .digits { font-family: 'JetBrains Mono', monospace; font-size: clamp(2.8rem, 12vw, 4rem); font-weight: 700; color: var(--text-secondary); line-height: 1; }
    .digits.running { color: var(--accent-green); text-shadow: 0 0 16px rgba(0, 255, 136, 0.3); }
    .digits.paused { color: var(--accent-amber); }
    .controls { display: flex; gap: 10px; margin-bottom: 16px; }

    .kpi-container { display: flex; gap: 12px; margin-bottom: 4px; }
    .kpi-card { flex: 1; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; text-align: center; }
    .kpi-title { display: block; font-size: 0.72rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
    .kpi-value { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); }

    .seccion { display: flex; align-items: center; gap: 10px; margin: 18px 0 12px; font-size: 0.78rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); }
    .seccion::before, .seccion::after { content: ""; flex: 1; height: 1px; background: var(--border-color); }

    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.2s ease;
    }
    .input-group:focus-within { border-color: var(--accent-green); }
    .input-group input { text-align: right; font-family: 'JetBrains Mono', monospace; }

    .fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .minutos-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.2s ease;
    }
    .minutos-group:focus-within { border-color: var(--accent-green); }
    .minutos-group input { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; width: 100%; margin-top: auto; margin-bottom: auto; color: var(--text-primary); }
    .fila-doble .input-group { flex-direction: column; align-items: center; gap: 4px; margin-bottom: 0; }
    .fila-doble .input-group input { text-align: center; font-size: 1.25rem; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; }
    .avance-row { display: flex; align-items: center; gap: 4px; width: 100%; }
    .avance-row input { min-width: 0; flex: 1; font-size: 1.25rem; }
    .btn-quick { flex: 0 0 auto; background: var(--card-bg); color: var(--accent-green); border: 1px solid var(--border-color); padding: 0; width: 36px; min-height: 36px; font-size: 0.8rem; border-radius: 10px; }
    .kindle-fields { display: flex; align-items: center; gap: 6px; }
    .kindle-fields input { width: 56px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 8px; text-align: center; }
    #kindleLabel { flex: 1; text-align: center; }

    button { padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: transform 0.1s ease, opacity 0.2s ease, filter 0.2s ease; }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
    .btn-start { flex: 1; background-color: var(--accent-btn); color: #04210f; }
    .btn-stop { flex: 1; background-color: var(--accent-red); color: #fff; }
    .btn-ghost { display: none; background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); padding: 14px 16px; }
    .btn-save { width: 100%; background-color: var(--accent-btn); color: #04210f; margin-top: 4px; }
    .btn-save:hover:not(:disabled) { filter: brightness(1.1); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-retry { display: none; background-color: var(--card-bg); color: var(--accent-green); border: 1px solid var(--border-color); padding: 8px 12px; font-size: 0.85rem; }

    #toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent-btn);
      color: #04210f;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    @media (prefers-reduced-motion: reduce) {
      .ring.running { animation: none; }
      * { transition: none !important; }
    }

    body { padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    #pendientes { text-align: center; font-size: 0.78rem; color: var(--accent-amber); margin-top: 10px; }
    #pendientes:empty { display: none; }

    /* MI RITMO */
    details.ritmo { margin-top: 16px; border-top: 1px solid var(--border-color); padding-top: 8px; }
    .ritmo summary { cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 40px; list-style: none; font-size: 0.78rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); }
    .ritmo summary::-webkit-details-marker { display: none; }
    .ritmo summary > span:first-child::after { content: ' ▾'; }
    .ritmo[open] summary > span:first-child::after { content: ' ▴'; }
    #ritmoResumen { color: var(--accent-amber); letter-spacing: 0; text-transform: none; font-size: 0.85rem; }
    .ritmo-body { padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .barras { display: flex; gap: 8px; align-items: flex-end; height: 120px; }
    .barra-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
    .barra-val { font-size: 0.65rem; color: var(--text-secondary); min-height: 0.8rem; }
    .barra-track { position: relative; flex: 1; width: 100%; display: flex; align-items: flex-end; background: rgba(255, 255, 255, 0.05); border-radius: 6px; overflow: hidden; }
    .meta-linea { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255, 255, 255, 0.7); pointer-events: none; z-index: 2; }
    .leyenda { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; font-size: 0.68rem; color: var(--text-secondary); }
    .ley-linea { display: inline-block; width: 16px; border-top: 1px dashed rgba(255, 255, 255, 0.7); margin-right: 4px; vertical-align: middle; }
    .ley-punto { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
    .barra { width: 100%; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; }
    .seg { min-height: 0; }
    .seg + .seg { border-top: 1px solid rgba(0, 0, 0, 0.35); }
    .barra-dia { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); }
    .barra-dia.hoy { color: var(--accent-green); }
    .ritmo .minutos-group input { font-size: 1rem; }   /* metas: números como los del tiempo Kindle */
    .ritmo-fila { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }

    /* AVISO AL TERMINAR UN LIBRO */
    .fin { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(8, 9, 12, 0.8); }
    .fin[hidden] { display: none; }
    .fin-card { width: 100%; max-width: 360px; text-align: center; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 28px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 10px; }
    .fin-emoji { font-size: 3rem; line-height: 1; }
    .fin-card h2 { font-size: 1.1rem; }
    .fin-card p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4; }
    #finLibro { color: var(--text-primary); font-weight: 700; }
    .fin-card button { margin-top: 8px; }

    /* ===== ESTILO: borde con degradado en botones y cajas; cajas con el mismo fondo que los botones ===== */
    :root {
      --grad-caja: linear-gradient(135deg, rgba(25, 217, 139, 0.55), #3a3f52 45%, rgba(159, 164, 181, 0.55));
      --grad-boton: linear-gradient(120deg, #19d98b, #9fa4b5 60%, #4e546a);
      --grad-rojo: linear-gradient(120deg, #ff4757, #b23a48 60%, #5a2a33);
      --grad-foco: linear-gradient(var(--accent-green), var(--accent-green));
    }
    .book-selector-container, .kpi-card, .input-group, .minutos-group {
      background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--grad-caja) border-box;
      border: 1px solid transparent;
    }
    .input-group:focus-within, .minutos-group:focus-within {
      background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--grad-foco) border-box;
    }
    .text-input, .kindle-fields input { background-color: var(--bg-color); }   /* campos hundidos dentro de las cajas */

    .btn-start, .btn-save, .btn-stop, .btn-ghost, .btn-retry, .btn-quick {
      color: var(--text-primary);
      background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--grad-boton) border-box;
      border: 1.5px solid transparent;
    }
    .btn-start, .btn-save, .btn-stop { padding: 12.5px; }
    .btn-ghost { padding: 12.5px 14.5px; color: var(--text-secondary); }
    .btn-stop { background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--grad-rojo) border-box; }
    .btn-retry { color: var(--accent-green); }
    .btn-quick { border-width: 1px; color: var(--accent-green); }
    /* Iniciar / Continuar: contorno brillante para que sea la acción principal */
    .btn-start { box-shadow: 0 0 16px rgba(25, 217, 139, 0.30), inset 0 0 10px rgba(25, 217, 139, 0.08); }
    .btn-start:active { box-shadow: 0 0 8px rgba(25, 217, 139, 0.25), inset 0 0 10px rgba(25, 217, 139, 0.08); }

    .confirm-dialog { width: min(420px, calc(100% - 32px)); max-width: none; padding: 0; border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-primary); background: var(--card-bg); box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55); }
    .confirm-dialog::backdrop { background: rgba(8, 9, 12, 0.78); backdrop-filter: blur(2px); }
    .confirm-card { padding: 24px 20px 18px; }
    .confirm-message { font-size: 0.98rem; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .confirm-actions button { min-width: 108px; padding: 11px 14px; color: var(--text-primary); background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--grad-boton) border-box; border: 1.5px solid transparent; }
    .confirm-actions .confirm-accept { background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, var(--grad-rojo) border-box; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-title">CRONÓMETRO DE LECTURA</div>

    <div class="book-selector-container">
      <label class="selector-label" for="bookSelect">Libro actual</label>
      <select id="bookSelect" onchange="handleBookSelectChange()">
        <option value="">Cargando libros...</option>
      </select>
      <button type="button" class="btn-retry" id="retryBooksBtn" onclick="loadBooks(getSelectedBookTitle() || null)">Reintentar</button>
      <small id="bookLockHint" hidden style="color: var(--text-secondary); font-size: 0.72rem;">El libro queda fijado durante la sesión.</small>

      <div id="newBookInputContainer" style="display: none;">
        <input type="text" id="newBookTitleInput" class="text-input" placeholder="Escribe el nombre del libro..." aria-label="Nombre del libro nuevo">
      </div>

      <div class="progress-container">
        <div class="progress-info">
          <span>Último avance</span>
          <span class="progress-pill" id="currentProgressText">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
          <div class="progress-bar-gain" id="progressBarGain"></div>
        </div>
      </div>
    </div>

    <div class="ring" id="ring">
      <div class="timer-display" id="timerDisplay">
        <div class="digits" id="timer">00:00:00</div>
        <div class="timer-meta" id="timerMeta"></div>
      </div>
      <svg class="ring-svg" id="ringSvg" aria-hidden="true" preserveAspectRatio="none">
        <path id="rTrack" pathLength="100"/>
        <path id="rBase" pathLength="100"/>
        <path id="rRun" pathLength="100"/>
        <path id="rTop" pathLength="100"/>
        <path class="rb" id="rB1" pathLength="100"/>
        <path class="rb" id="rB2" pathLength="100"/>
        <path class="rb" id="rB3" pathLength="100"/>
        <path class="rb" id="rB4" pathLength="100"/>
        <path class="rb" id="rB5" pathLength="100"/>
        <path class="rb" id="rB6" pathLength="100"/>
        <path class="rb" id="rB7" pathLength="100"/>
        <path class="rb" id="rB8" pathLength="100"/>
      </svg>
    </div>

    <div class="controls">
      <button class="btn-start" id="startBtn" onclick="toggleTimer()">Iniciar Cronómetro</button>
      <button type="button" class="btn-ghost" id="discardBtn" onclick="descartarCrono()">Descartar</button>
    </div>

    <div class="kpi-container">
      <div class="kpi-card">
        <span class="kpi-title">Total</span>
        <div class="kpi-value" id="kpiTotalMin">0 min</div>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Prom/Día</span>
        <div class="kpi-value" id="kpiAvgDaily">0 min</div>
      </div>
    </div>

    <div class="seccion">Cerrar sesión</div>

    <div class="fila-doble">
      <div class="minutos-group">
        <label class="selector-label" for="manualMinutesInput">Minutos leídos</label>
        <input type="number" id="manualMinutesInput" min="0" placeholder="0" inputmode="numeric">
      </div>
      <div class="input-group">
        <label class="selector-label" for="newProgressInput">Nvo. avance(%)</label>
        <div class="avance-row">
          <button type="button" class="btn-quick" onclick="sumarAvance(1)" aria-label="Sumar 1 por ciento">+1</button>
          <input type="number" id="newProgressInput" min="0" max="100" inputmode="numeric">
          <button type="button" class="btn-quick" onclick="sumarAvance(5)" aria-label="Sumar 5 por ciento">+5</button>
        </div>
      </div>
    </div>

    <div class="input-group">
      <span class="selector-label" id="kindleLabel" aria-label="Tiempo restante según Kindle, opcional">· T. Kindle ·</span>
      <div class="kindle-fields" role="group" aria-labelledby="kindleLabel">
        <input type="number" id="kindleHorasInput" min="0" inputmode="numeric" aria-label="Horas restantes">
        <span class="selector-label">h</span>
        <input type="number" id="kindleMinsInput" min="0" max="59" inputmode="numeric" aria-label="Minutos restantes">
        <span class="selector-label">min</span>
      </div>
    </div>

    <button class="btn-save" id="saveBtn" onclick="handleSaveSession()" disabled>Guardar Sesión</button>
    <div id="pendientes" aria-live="polite"></div>

    <details class="ritmo" id="ritmo">
      <summary><span>Mi ritmo</span><span id="ritmoResumen"></span></summary>
      <div class="ritmo-body">
        <div class="barras" id="ritmoBarras" role="img" aria-label="Minutos leídos en los últimos 7 días"></div>
        <div class="leyenda" id="ritmoLeyenda"></div>
        <div class="ritmo-fila"><span class="selector-label">Hoy</span><span id="ritmoHoy">0 / 30 min</span></div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="ritmoHoyBar"></div><div class="progress-bar-gain" id="ritmoHoyExtra"></div></div>
        <div class="ritmo-fila"><span class="selector-label">Esta semana</span><span id="ritmoSemana">0 min</span></div>
        <div class="ritmo-fila"><span class="selector-label">Terminados <span id="ritmoAnio"></span></span><span id="ritmoLibros">0 / 24</span></div>
        <div class="fila-doble">
          <div class="minutos-group">
            <label class="selector-label" for="metaDiariaInput">Meta diaria</label>
            <input type="number" id="metaDiariaInput" min="1" inputmode="numeric">
          </div>
          <div class="minutos-group">
            <label class="selector-label" for="metaAnualInput">Meta anual</label>
            <input type="number" id="metaAnualInput" min="1" inputmode="numeric">
          </div>
        </div>
      </div>
    </details>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmMessage">
    <form method="dialog" class="confirm-card">
      <p id="confirmMessage" class="confirm-message"></p>
      <div class="confirm-actions">
        <button type="submit" value="cancel">Cancelar</button>
        <button type="submit" value="confirm" class="confirm-accept">Aceptar</button>
      </div>
    </form>
  </dialog>

  <div id="fin" class="fin" hidden role="dialog" aria-modal="true" aria-labelledby="finTitulo">
    <div class="fin-card">
      <div class="fin-emoji" aria-hidden="true">🎉</div>
      <h2 id="finTitulo">¡Terminaste un libro!</h2>
      <p id="finLibro"></p>
      <p id="finDatos"></p>
      <button type="button" class="btn-start" id="finBtn" onclick="cerrarFin()">Seguir leyendo</button>
    </div>
  </div>

  <script>
    const MAX_HORAS = 12;
    // ---- Dirección de Apps Script: no está escrita en este archivo, se pide una vez por dispositivo ----
    const CLAVE_URL = 'direccionAppsScript';
    const CLAVE_API = 'claveApi';          // clave opcional que pide Apps Script
    let claveCancelada = false;
    const params = new URLSearchParams(location.search);
    function valida(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u || ''); }

    // ?reset=1 borra la dirección y la clave guardadas
    if (params.get('reset')) {
      try { localStorage.removeItem(CLAVE_URL); localStorage.removeItem(CLAVE_API); } catch (e) {}
      params.delete('reset');
      const resto = params.toString();
      history.replaceState(null, '', location.pathname + (resto ? '?' + resto : ''));
    }
    let API = null;
    try { API = localStorage.getItem(CLAVE_URL); } catch (e) {}
    if (!valida(API)) {
      API = (prompt('Pega la dirección de tu aplicación (termina en /exec):') || '').trim();
      if (valida(API)) {
        try { localStorage.setItem(CLAVE_URL, API); } catch (e) {}
      } else {
        API = null;
        document.body.innerHTML = '<p style="color:#e1e2e6;font-family:sans-serif;padding:24px;line-height:1.5">Falta la dirección de la aplicación.<br>Recarga la página y pégala completa (termina en /exec).</p>';
      }
    }
    const LIBRO_PARAM = params.get('libro') || '';

    let paramAplicado = false;
    let timerInterval = null;
    let seconds = 0;
    let libroSesion = '';
    let startMs = 0;
    let isRunning = false;
    let booksData = [];
    let pendienteNuevo = '';
    let minsManual = false;
    let estadoRestaurado = false;
    let guardando = false;
    let avanceActual = 0;
    let sincronizando = false;
    let minHoyGuardados = 0;   // minutos de hoy ya guardados (hoja + pendientes)

    const $ = id => document.getElementById(id);

    function iniciar() {
      $('bookSelect').addEventListener('change', guardarEstado);
      $('newBookTitleInput').addEventListener('change', guardarEstado);
      $('newBookTitleInput').addEventListener('input', actualizarGuardar);
      $('manualMinutesInput').addEventListener('input', function() { minsManual = true; actualizarGuardar(); });
      $('newProgressInput').addEventListener('input', function() { previewAvance(); actualizarGuardar(); });
      actualizarGuardar();
      actualizarPendientes();

      loadBooks(restaurarEstado());
      sincronizar();

      const metas = leerMetas();
      $('metaDiariaInput').value = metas.diaria;
      $('metaAnualInput').value = metas.anual;
      ['metaDiariaInput', 'metaAnualInput'].forEach(function(id) {
        $(id).addEventListener('change', guardarMetas);
      });
      loadResumen();
      if (window.ResizeObserver) new ResizeObserver(function() { pintarAnillo(elapsedSeconds()); }).observe($('timerDisplay'));
      setInterval(function() { if (leerCola().length) sincronizar(); }, 60000);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      }
    }

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        guardarEstado();
      } else {
        if (isRunning) pintarReloj();
        renderRitmo();
        sincronizar();
      }
    });

    window.addEventListener('online', function() {
      toast('Conexión restablecida.');
      sincronizar();
      if ($('retryBooksBtn').style.display === 'block') loadBooks($('bookSelect').value || null);
    });

    window.addEventListener('offline', function() {
      toast('Sin conexión. Todo se guardará en este dispositivo.');
    });

    function toast(msg) {
      const t = $('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function vibrar() {
      try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
    }

    function elapsedSeconds() {
      return seconds + (isRunning ? Math.floor((Date.now() - startMs) / 1000) : 0);
    }

    function aplicarEstadoVisual(total) {
      const pausado = !isRunning && total > 0;
      $('ring').classList.toggle('running', isRunning);
      $('ring').classList.toggle('paused', pausado);
      $('timer').classList.toggle('running', isRunning);
      $('timer').classList.toggle('paused', pausado);
      $('discardBtn').style.display = total > 0 ? 'block' : 'none';
      const libroBloqueado = isRunning || seconds > 0;
      $('bookSelect').disabled = libroBloqueado;
      $('newBookTitleInput').disabled = libroBloqueado;
      $('bookLockHint').hidden = !libroBloqueado;
      pintarAnillo(total);
    }

    // El anillo es una barra de progreso sobre el borde del reloj: la meta diaria recorre el perímetro.
    // Cada vuelta completa = una meta; las vueltas extra se dibujan encima con otro color.
    // Mientras corre el cronómetro, la punta del avance se ensancha (como si los píxeles se expandieran).
    const COLORES_VUELTA = ['#19d98b', '#9fa4b5', '#737990', '#4e546a'];
    const IDS_ANILLO = ['rTrack', 'rBase', 'rRun', 'rTop', 'rB1', 'rB2', 'rB3', 'rB4', 'rB5', 'rB6', 'rB7', 'rB8'];
    const LARGO_PUNTA = [0.08, 0.07, 0.06, 0.05, 0.04, 0.03, 0.02, 0.01];   // fracción del perímetro de cada capa de la punta
    const ENSANCHE_PUNTA = [0.8, 1.6, 2.4, 3.2, 4, 4.8, 5.6, 6.4];   // píxeles extra de grosor de cada capa
    let trazoPrevio = '';
    let posPrevia = 0;

    // Rectángulo redondeado (línea central del anillo) que empieza arriba al centro y gira en sentido horario
    function trazoAnillo(W, H, g) {
      const x0 = g / 2, y0 = g / 2, x1 = W - g / 2, y1 = H - g / 2, r = 18 + g / 2, cx = W / 2;
      return 'M' + cx + ',' + y0 + ' H' + (x1 - r) + ' A' + r + ',' + r + ' 0 0 1 ' + x1 + ',' + (y0 + r) +
        ' V' + (y1 - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x1 - r) + ',' + y1 +
        ' H' + (x0 + r) + ' A' + r + ',' + r + ' 0 0 1 ' + x0 + ',' + (y1 - r) +
        ' V' + (y0 + r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x0 + r) + ',' + y0 + ' H' + cx;
    }

    // Dibuja el tramo [ini, fin] (fracciones 0..1 del perímetro)
    function tramo(id, ini, fin, color, grosor) {
      const el = $(id);
      const len = Math.max(0, fin - ini) * 100;
      if (len < 0.05) { el.style.display = 'none'; return; }
      el.style.display = '';
      el.style.stroke = color;
      el.style.strokeWidth = grosor + 'px';
      el.style.strokeDasharray = len + ' ' + Math.max(0.001, 100 - len);
      el.style.strokeDashoffset = String(-ini * 100);
    }

    function pintarAnillo(total) {
      const meta = leerMetas().diaria;
      const sesion = total / 60;
      const hoy = minHoyGuardados;
      const r = (hoy + sesion) / meta;                  // 1 = meta cumplida, 2 = el doble...
      const vueltas = Math.floor(r);
      const ring = $('ring');

      // Geometría: el SVG mide lo mismo que el anillo (reloj + grosor a cada lado)
      const g = isRunning ? 5 : 3;
      const W = $('timerDisplay').offsetWidth + 2 * g;
      const H = $('timerDisplay').offsetHeight + 2 * g;
      const svg = $('ringSvg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      const d = trazoAnillo(W, H, g);
      if (d !== trazoPrevio) {
        IDS_ANILLO.forEach(function(id) { $(id).setAttribute('d', d); });
        trazoPrevio = d;
      }
      $('rTrack').style.strokeWidth = g + 'px';

      // Tramos de color y posición de la punta (fracción del perímetro)
      let cabeza;
      let colorCabeza;
      if (vueltas >= 1) {
        const extra = r - vueltas;
        tramo('rBase', 0, 1, COLORES_VUELTA[(vueltas - 1) % 4], g);
        tramo('rRun', 0, 0, '', g);
        tramo('rTop', 0, extra, COLORES_VUELTA[vueltas % 4], g);
        cabeza = extra;
        colorCabeza = COLORES_VUELTA[vueltas % 4];
      } else {
        const guardado = Math.min(1, hoy / meta);
        tramo('rBase', 0, guardado, '#138a5f', g);                                     // lo ya leído hoy
        tramo('rRun', guardado, r, isRunning ? 'var(--accent-green)' : 'var(--accent-amber)', g);   // sesión en curso / en pausa
        tramo('rTop', 0, 0, '', g);
        cabeza = r;
        colorCabeza = 'var(--accent-green)';
      }

      // Al cerrar una vuelta (o al guardar) el avance "salta" atrás: sin animación para que no rebobine
      if (cabeza < posPrevia - 0.01) {
        svg.classList.add('sin-anim');
        requestAnimationFrame(function() { requestAnimationFrame(function() { svg.classList.remove('sin-anim'); }); });
      }
      posPrevia = cabeza;

      // La punta: capas cada vez más cortas y más gruesas que terminan en el avance.
      // La capa final lleva un halo del mismo color para que el ojo siga el movimiento.
      for (let i = 0; i < 8; i++) {
        const punta = $('rB' + (i + 1));
        if (isRunning) {
          tramo('rB' + (i + 1), cabeza - LARGO_PUNTA[i], cabeza, colorCabeza, g + ENSANCHE_PUNTA[i]);
          punta.style.filter = i === 7 ? 'drop-shadow(0 0 4px ' + colorCabeza + ')' : '';
        } else {
          punta.style.display = 'none';
          punta.style.filter = '';
        }
      }

      const cumplida = vueltas >= 1;
      const acum = Math.floor(hoy + sesion);
      ring.classList.toggle('meta-ok', cumplida);
      const el = $('timerMeta');
      el.classList.toggle('ok', cumplida);
      if (!cumplida) {
        el.textContent = 'Hoy ' + acum + ' / ' + meta + ' min · faltan ' + Math.ceil(meta - hoy - sesion);
      } else if (vueltas === 1) {
        el.textContent = '✓ Meta cumplida · ' + acum + ' min hoy' + (acum > meta ? ' (+' + (acum - meta) + ')' : '');
      } else {
        el.textContent = '✓ Meta ×' + vueltas + ' · ' + acum + ' min hoy';
      }

      // Aviso una sola vez al cruzar la meta con el cronómetro en marcha
      if (isRunning && cumplida && hoy < meta) {
        const f = fechaHace(0);
        if (lsGet('avisoMeta', '') !== f) {
          lsSet('avisoMeta', f);
          toast('🎯 ¡Meta diaria cumplida!');
          try { if (navigator.vibrate) navigator.vibrate([40, 30, 40]); } catch (e) {}
        }
      }
    }

    function pintarReloj() {
      const total = elapsedSeconds();
      const h = String(Math.floor(total / 3600)).padStart(2, '0');
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
      const s = String(total % 60).padStart(2, '0');
      $('timer').innerText = `${h}:${m}:${s}`;
      if (!minsManual) {
        $('manualMinutesInput').value = total > 0 ? Math.max(1, Math.round(total / 60)) : '';
      }
      aplicarEstadoVisual(total);
      actualizarGuardar();
    }

    function mostrarEstadoReloj() {
      const btn = $('startBtn');
      clearInterval(timerInterval);
      if (isRunning) {
        btn.innerText = 'Pausar';
        btn.className = 'btn-stop';
        timerInterval = setInterval(pintarReloj, 1000);
      } else {
        btn.innerText = 'Continuar Cronómetro';
        btn.className = 'btn-start';
      }
      pintarReloj();
    }

    // El reloj vive en este dispositivo (sobrevive a cerrar la app)
    function guardarEstado() {
      if (!isRunning && seconds === 0) return;
      lsSet('cronoEstado', {
        isRunning: isRunning,
        startMs: startMs,
        seconds: seconds,
        libro: $('bookSelect').value,
        libroSesion: libroSesion,
        nuevo: $('newBookTitleInput').value
      });
    }

    // Devuelve el libro que estaba seleccionado con el reloj (o null)
    function restaurarEstado() {
      const est = lsGet('cronoEstado', null);
      let seleccionar = null;
      if (est && (est.isRunning || Number(est.seconds) > 0)) {
        seconds = Number(est.seconds) || 0;
        isRunning = !!est.isRunning;
        startMs = Number(est.startMs) || 0;
        libroSesion = est.libroSesion || (est.libro === '__NEW__' ? est.nuevo : est.libro) || '';
        if (elapsedSeconds() > MAX_HORAS * 3600) {
          resetTimer();
          toast('Se descartó un cronómetro de más de ' + MAX_HORAS + ' h.');
        } else {
          estadoRestaurado = true;
          seleccionar = est.libro || null;
          pendienteNuevo = est.nuevo || '';
          mostrarEstadoReloj();
        }
      }
      return seleccionar;
    }

    function formatearMin(total) {
      const t = Math.max(0, Math.round(Number(total) || 0));
      const h = Math.floor(t / 60);
      const m = t % 60;
      return h > 0 ? h + ' h ' + m + ' min' : m + ' min';
    }

    function mostrarMetricas(m, titulo) {
      const pend = leerCola()
        .filter(x => x.bookTitle.toLowerCase() === titulo.toLowerCase())
        .reduce((a, x) => a + x.minutes, 0);
      if (!m && !pend) {
        $('kpiTotalMin').innerText = '-- min';
        $('kpiAvgDaily').innerText = '-- min';
        return;
      }
      $('kpiTotalMin').innerText = formatearMin((m ? m.totalMinutes : 0) + pend);
      $('kpiAvgDaily').innerText = m ? formatearMin(m.avgDaily) : '-- min';
    }

    async function loadMetrics() {
      const titulo = getSelectedBookTitle();
      if (!titulo) {
        $('kpiTotalMin').innerText = '0 min';
        $('kpiAvgDaily').innerText = '0 min';
        return;
      }
      const cache = lsGet('metricasCache', {});
      mostrarMetricas(cache[titulo] || null, titulo);
      if (!navigator.onLine) return;
      try {
        const m = await apiGet({ action: 'metricas', libro: titulo });
        if (m && typeof m.totalMinutes === 'number') {
          cache[titulo] = m;
          lsSet('metricasCache', cache);
          if (titulo === getSelectedBookTitle()) mostrarMetricas(m, titulo);
        }
      } catch (e) {}
    }

    // Llena el selector con booksData y deja elegido "seleccionar"
    function poblarLibros(seleccionar) {
      const select = $('bookSelect');
      select.innerHTML = '';
      booksData.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.title;
        opt.innerText = b.title;
        select.appendChild(opt);
      });
      const optNew = document.createElement('option');
      optNew.value = '__NEW__';
      optNew.innerText = '+ Agregar nuevo libro';
      select.appendChild(optNew);

      if (seleccionar === '__NEW__') {
        select.value = '__NEW__';
        if (pendienteNuevo) {
          $('newBookTitleInput').value = pendienteNuevo;
          pendienteNuevo = '';
        }
      } else if (seleccionar && booksData.some(b => b.title === seleccionar)) {
        select.value = seleccionar;
      }
    }

    // Las sesiones pendientes de enviar ya cuentan en la lista local
    function aplicarPendientesALibros() {
      leerCola().forEach(function(x) {
        const b = booksData.find(k => k.title.toLowerCase() === x.bookTitle.toLowerCase());
        if (b) b.progress = x.progress;
        else booksData.push({ title: x.bookTitle, author: 'En lectura', progress: x.progress });
      });
      booksData = booksData.filter(b => b.progress < 100);
    }

    // ?libro=Titulo: se aplica una sola vez y solo si no hay un reloj en curso
    function aplicarParamLibro() {
      if (!LIBRO_PARAM || paramAplicado) return false;
      paramAplicado = true;
      if (estadoRestaurado) return false;
      const select = $('bookSelect');
      const hallado = booksData.find(b => b.title.trim().toLowerCase() === LIBRO_PARAM.trim().toLowerCase());
      if (hallado) {
        select.value = hallado.title;
      } else {
        select.value = '__NEW__';
        $('newBookTitleInput').value = LIBRO_PARAM.trim();
      }
      return true;
    }

    async function loadBooks(seleccionar) {
      const retryBtn = $('retryBooksBtn');

      // 1) Se muestra al instante la lista guardada en este dispositivo
      const cache = lsGet('librosCache', null);
      if (cache) {
        booksData = cache;
        aplicarPendientesALibros();
        poblarLibros(seleccionar);
        aplicarParamLibro();
        handleBookSelectChange();
      }

      if (!navigator.onLine) {
        retryBtn.style.display = 'block';
        if (!cache) {
          $('bookSelect').innerHTML = '<option value="">Sin conexión y sin lista guardada</option>';
        } else {
          toast('Sin conexión. Se muestra la lista guardada; se actualizará al reconectar.');
        }
        return;
      }

      // 2) Se actualiza desde el servidor
      try {
        const r = await apiGet({ action: 'libros' });
        if (!Array.isArray(r)) throw new Error((r && r.error) || 'Respuesta inválida');
        retryBtn.style.display = 'none';
        lsSet('librosCache', r);

        const antes = avanceActual;
        const eleccion = cache ? ($('bookSelect').value || seleccionar) : seleccionar;
        booksData = r;
        aplicarPendientesALibros();
        poblarLibros(eleccion);
        const param = aplicarParamLibro();
        const sel = booksData.find(b => b.title === $('bookSelect').value);
        if (!cache || param || !sel || sel.progress !== antes) handleBookSelectChange();
        else loadMetrics();
      } catch (err) {
        console.error('Error al cargar libros:', err);
        // Siempre se permite reintentar, incluso si mostramos datos guardados.
        retryBtn.style.display = 'block';
        if (!cache) {
          $('bookSelect').innerHTML = '<option value="">No se pudieron cargar los libros</option>';
          toast('No se pudieron cargar los libros. Comprueba la conexión e inténtalo de nuevo.');
        } else {
          toast('No se pudieron actualizar los libros. Se conserva la lista guardada; puedes reintentar.');
        }
      }
    }

    function handleBookSelectChange() {
      const selectValue = $('bookSelect').value;
      if (selectValue === '__NEW__') {
        $('newBookInputContainer').style.display = 'block';
        avanceActual = 0;
        $('currentProgressText').innerText = '0%';
        $('progressBarFill').style.width = '0%';
        $('newProgressInput').value = '0';
        $('kpiTotalMin').innerText = '0 min';
        $('kpiAvgDaily').innerText = '0 min';
        previewAvance();
        actualizarGuardar();
      } else {
        $('newBookInputContainer').style.display = 'none';
        updateSelectedBookProgress();
      }
    }

    function getSelectedBookTitle() {
      const selectValue = $('bookSelect').value;
      if ((isRunning || seconds > 0) && libroSesion) return libroSesion;
      if (selectValue === '__NEW__') {
        return $('newBookTitleInput').value.trim();
      }
      return selectValue;
    }

    function updateSelectedBookProgress() {
      const title = $('bookSelect').value;
      const book = booksData.find(b => b.title === title);
      avanceActual = book ? book.progress : 0;

      $('currentProgressText').innerText = avanceActual + '%';
      $('progressBarFill').style.width = avanceActual + '%';
      $('newProgressInput').value = avanceActual;

      previewAvance();
      actualizarGuardar();
      loadMetrics();
    }

    function previewAvance() {
      const nuevo = Math.min(100, Math.max(0, Number($('newProgressInput').value) || 0));
      const gain = $('progressBarGain');
      gain.style.left = avanceActual + '%';
      gain.style.width = Math.max(0, nuevo - avanceActual) + '%';
    }

    function sumarAvance(n) {
      const input = $('newProgressInput');
      input.value = Math.min(100, (Number(input.value) || 0) + n);
      vibrar();
      previewAvance();
      actualizarGuardar();
    }

    function actualizarGuardar() {
      const btn = $('saveBtn');
      const titulo = getSelectedBookTitle();
      const raw = String($('newProgressInput').value).replace('%', '').trim();
      const p = Number(raw);
      const progresoOk = raw !== '' && !isNaN(p) && p >= 0 && p <= 100;
      const manual = Number($('manualMinutesInput').value);
      const mins = manual > 0 ? manual : Math.round(elapsedSeconds() / 60);
      btn.disabled = guardando || !(titulo && progresoOk && (mins > 0 || p === 0));
    }

    function toggleTimer() {
      const btn = $('startBtn');
      vibrar();

      if (!isRunning) {
        if (seconds === 0) {
          libroSesion = getSelectedBookTitle();
          if (!libroSesion) {
            toast('Selecciona o escribe un libro antes de iniciar.');
            return;
          }
        }
        isRunning = true;
        startMs = Date.now();
        btn.innerText = 'Pausar';
        btn.className = 'btn-stop';
        timerInterval = setInterval(pintarReloj, 1000);
      } else {
        seconds = elapsedSeconds();
        isRunning = false;
        clearInterval(timerInterval);
        btn.innerText = 'Continuar Cronómetro';
        btn.className = 'btn-start';
      }
      pintarReloj();
      guardarEstado();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      seconds = 0;
      startMs = 0;
      libroSesion = '';
      minsManual = false;
      const btn = $('startBtn');
      btn.innerText = 'Iniciar Cronómetro';
      btn.className = 'btn-start';
      pintarReloj();
      lsDel('cronoEstado');
    }

    function mostrarConfirmacion(mensaje) {
      const dialog = $('confirmDialog');
      $('confirmMessage').textContent = mensaje;
      dialog.returnValue = '';
      return new Promise(function(resolve) {
        dialog.addEventListener('close', function() {
          resolve(dialog.returnValue === 'confirm');
        }, { once: true });
        dialog.showModal();
      });
    }

    async function descartarCrono() {
      const aceptar = await mostrarConfirmacion('¿Descartar el cronómetro? Se perderá el tiempo acumulado.');
      if (!aceptar) return;
      resetTimer();
      $('manualMinutesInput').value = '';
      toast('Cronómetro descartado.');
    }

    async function handleSaveSession() {
      const btn = $('saveBtn');
      if (btn.disabled) return;

      const bookTitle = getSelectedBookTitle();
      if (!bookTitle) {
        alert('Ingresa o selecciona un título de libro válido.');
        return;
      }

      const manualMins = Number($('manualMinutesInput').value);
      const timerMins = Math.round(elapsedSeconds() / 60);

      const progressRaw = $('newProgressInput').value;
      const progress = Number(String(progressRaw).replace('%', '').trim());
      if (String(progressRaw).trim() === '' || isNaN(progress) || progress < 0 || progress > 100) {
        alert('El avance debe ser un número entre 0 y 100.');
        return;
      }

      const minutes = manualMins > 0 ? manualMins : timerMins;
      if (minutes <= 0 && progress > 0) {
        alert('Escribe los minutos leídos o usa el cronómetro.');
        return;
      }

      const libro = booksData.find(b => b.title === bookTitle);
      const ultimo = libro ? libro.progress : 0;
      if (libro && progress <= ultimo) {
        const ok = await mostrarConfirmacion(`El avance (${progress}%) no es mayor que el último (${ultimo}%). ¿Guardar la sesión de todos modos?`);
        if (!ok) return;
      }

      const kH = $('kindleHorasInput').value.trim();
      const kM = $('kindleMinsInput').value.trim();
      let kindleFalta = '';
      if (kH !== '' || kM !== '') {
        const h = Number(kH || 0), m = Number(kM || 0);
        if (isNaN(h) || isNaN(m) || h < 0 || m < 0 || m > 59) {
          alert('Revisa el tiempo de Kindle: horas desde 0 y minutos entre 0 y 59.');
          return;
        }
        kindleFalta = h + ' h ' + m + ' min';
      }

      const sesion = {
        id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2),
        bookTitle: bookTitle,
        minutes: minutes,
        progress: progress,
        kindleFalta: kindleFalta,
        fecha: fechaLocal(Date.now())
      };

      // Siempre se guarda primero en este dispositivo; después se envía a la hoja
      const cola = leerCola();
      cola.push(sesion);
      if (!escribirCola(cola)) {
        alert('No se pudo guardar en este dispositivo. Intenta de nuevo.');
        return;
      }

      vibrar();
      toast(navigator.onLine ? '¡Sesión guardada!' : 'Sesión guardada. Se enviará al reconectar.');
      guardando = true;                                   // evita un doble toque
      setTimeout(function() { guardando = false; actualizarGuardar(); }, 800);
      resetTimer();
      $('manualMinutesInput').value = '';
      $('newBookTitleInput').value = '';
      $('kindleHorasInput').value = '';
      $('kindleMinsInput').value = '';
      actualizarPendientes();
      renderRitmo();
      if (progress >= 100) mostrarFin(bookTitle, minutes);
      loadBooks(bookTitle);
      sincronizar();
    }

    // ---- Datos locales y sincronización ----
    function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
    function leerCola() { return lsGet('sesionesPendientes', []); }
    function escribirCola(c) { return lsSet('sesionesPendientes', c); }

    function fechaLocal(ts) {
      const d = new Date(ts);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function actualizarPendientes() {
      const n = leerCola().length;
      $('pendientes').textContent = n ? n + (n === 1 ? ' sesión pendiente de enviar' : ' sesiones pendientes de enviar') : '';
    }

    function leerClave() { try { return localStorage.getItem(CLAVE_API) || ''; } catch (e) { return ''; } }

    // "construir" recibe la clave guardada y devuelve { query, opciones }
    async function apiFetch(construir) {
      for (let intento = 0; intento < 2; intento++) {
        const c = construir(leerClave());
        const ctl = new AbortController();
        const t = setTimeout(function() { ctl.abort(); }, 20000);
        let r;
        try {
          const resp = await fetch(API + (c.query ? '?' + new URLSearchParams(c.query) : ''), Object.assign({ signal: ctl.signal }, c.opciones));
          r = await resp.json();
        } finally {
          clearTimeout(t);
        }
        if (r && r.error === 'clave') {                    // el servidor pide clave (o la guardada ya no sirve)
          if (intento === 1) { try { localStorage.removeItem(CLAVE_API); } catch (e) {} throw new Error('clave'); }
          if (claveCancelada) throw new Error('clave');
          const k = (prompt('Esta app está protegida. Escribe tu clave:') || '').trim();
          if (!k) { claveCancelada = true; throw new Error('clave'); }
          try { localStorage.setItem(CLAVE_API, k); } catch (e) {}
          continue;
        }
        return r;
      }
      throw new Error('clave');
    }
    function apiGet(q) {
      return apiFetch(function(k) { return { query: Object.assign({}, q, k ? { k: k } : {}) }; });
    }
    // Sin cabecera personalizada: así el navegador no hace "preflight" contra Apps Script
    function apiPost(body) {
      return apiFetch(function(k) { return { opciones: { method: 'POST', body: JSON.stringify(Object.assign({}, body, k ? { k: k } : {})) } }; });
    }

    async function sincronizar() {
      if (sincronizando || !API || !navigator.onLine) return;
      let cola = leerCola();
      if (!cola.length) return;
      sincronizando = true;
      let enviadas = 0;
      try {
        while (cola.length) {
          const x = cola[0];
          let r;
          try {
            r = await apiPost({ action: 'guardar', id: x.id, bookTitle: x.bookTitle, minutes: x.minutes, progress: x.progress, kindleFalta: x.kindleFalta, fecha: x.fecha });
          } catch (e) {
            break;                                         // sin red o sin respuesta: se reintenta después
          }
          if (r && r.ok) {
            enviadas++;
          } else {                                         // el servidor la rechazó: se aparta para no bloquear
            const f = lsGet('sesionesFallidas', []);
            f.push(Object.assign({}, x, { error: (r && r.error) || 'desconocido' }));
            lsSet('sesionesFallidas', f);
            toast('Una sesión fue rechazada por el servidor.');
          }
          cola.shift();
          escribirCola(cola);
          actualizarPendientes();
        }
      } finally {
        sincronizando = false;
        actualizarPendientes();
      }
      if (enviadas) toast(enviadas === 1 ? 'Sesión sincronizada.' : enviadas + ' sesiones sincronizadas.');
      if (enviadas && !leerCola().length) {
        loadBooks($('bookSelect').value || null);
        loadMetrics();
        loadResumen();
      }
    }

    // ---- Mi ritmo: gráfica semanal, metas y racha ----
    // Libros de 2026 que ya habías leído antes de usar el cronómetro.
    // Solo vale en ese año: desde enero de 2027 se ignora sola.
    const LIBROS_PREVIOS = { anio: 2026, cantidad: 34 };

    function leerMetas() {
      const m = lsGet('metas', {});
      return {
        diaria: Number(m.diaria) > 0 ? Number(m.diaria) : 30,
        anual: Number(m.anual) > 0 ? Number(m.anual) : 24,
        base: new Date().getFullYear() === LIBROS_PREVIOS.anio ? LIBROS_PREVIOS.cantidad : 0
      };
    }

    function guardarMetas() {
      lsSet('metas', {
        diaria: Number($('metaDiariaInput').value) || 30,
        anual: Number($('metaAnualInput').value) || 24
      });
      renderRitmo();
    }

    function fechaHace(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return fechaLocal(d.getTime());
    }

    // Minutos por día: lo que ya está en la hoja + lo que sigue pendiente de enviar
    function minutosPorDia() {
      const r = lsGet('resumenCache', { dias: {} });
      const d = Object.assign({}, r.dias || {});
      leerCola().forEach(function(x) {
        if (x.minutes > 0) d[x.fecha] = (d[x.fecha] || 0) + x.minutes;
      });
      return d;
    }

    // Racha = días seguidos cumpliendo la meta diaria (si hoy aún no la cumples, cuenta desde ayer)
    function calcularRacha(d, meta) {
      let n = 0;
      let i = (d[fechaHace(0)] || 0) >= meta ? 0 : 1;
      while ((d[fechaHace(i)] || 0) >= meta && i < 5000) { n++; i++; }
      return n;
    }

    // Mejor racha de todo el historial, con la meta actual
    function calcularRecord(d, meta) {
      const dias = Object.keys(d).sort();
      if (!dias.length) return 0;
      const fin = fechaHace(0);
      const cur = new Date(dias[0] + 'T00:00:00');
      let mejor = 0;
      let run = 0;
      let guardia = 0;
      while (fechaLocal(cur.getTime()) <= fin && guardia++ < 5000) {
        if ((d[fechaLocal(cur.getTime())] || 0) >= meta) { run++; if (run > mejor) mejor = run; } else { run = 0; }
        cur.setDate(cur.getDate() + 1);
      }
      return mejor;
    }

    function terminadosAnio() {
      const r = lsGet('resumenCache', { terminados: 0 });
      const pend = new Set(leerCola().filter(x => x.progress >= 100).map(x => x.bookTitle.toLowerCase())).size;
      return leerMetas().base + (r.terminados || 0) + pend;
    }

    // Una barra por día: los primeros "meta" minutos en verde, los siguientes en dorado, azul, violeta...
    // Un día que no llegó a la meta se queda en gris.
    function segmentosBarra(m, meta) {
      if (m <= 0) return '';
      if (m < meta) return '<div class="seg" style="flex:' + m + ';background:var(--text-secondary);opacity:0.6"></div>';
      let html = '';
      let resto = m;
      let i = 0;
      while (resto > 0) {
        const parte = (i >= 11) ? resto : Math.min(meta, resto);
        html += '<div class="seg" style="flex:' + parte + ';background:' + COLORES_VUELTA[i % 4] + '"></div>';
        resto -= parte;
        i++;
      }
      return html;
    }

    function renderRitmo() {
      const d = minutosPorDia();
      const metas = leerMetas();
      const hoy = d[fechaHace(0)] || 0;
      minHoyGuardados = hoy;
      const racha = calcularRacha(d, metas.diaria);
      const record = Math.max(racha, calcularRecord(d, metas.diaria));
      $('ritmoResumen').textContent = (racha > 0 ? '🔥 ' + racha + (racha === 1 ? ' día' : ' días') : '') +
        (record > 0 ? (racha > 0 ? ' · ' : '') + 'récord ' + record : '');

      const letras = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
      const dias = [];
      let semana = 0;
      let max = metas.diaria;
      for (let i = 6; i >= 0; i--) {
        const f = fechaHace(i);
        const m = d[f] || 0;
        semana += m;
        max = Math.max(max, m);
        dias.push({ m: m, letra: letras[new Date(f + 'T00:00:00').getDay()], hoy: i === 0 });
      }
      $('ritmoBarras').innerHTML = dias.map(function(x) {
        return '<div class="barra-col"><span class="barra-val">' + (x.m || '') + '</span>' +
          '<div class="barra-track"><div class="barra" style="height:' + Math.round(x.m / max * 100) + '%">' + segmentosBarra(x.m, metas.diaria) + '</div>' +
          '<div class="meta-linea" style="bottom:' + Math.min(99, metas.diaria / max * 100) + '%"></div></div>' +
          '<span class="barra-dia' + (x.hoy ? ' hoy' : '') + '">' + x.letra + '</span></div>';
      }).join('');

      $('ritmoLeyenda').innerHTML = '<span><i class="ley-linea"></i>Meta ' + metas.diaria + ' min</span><span>Vueltas:</span>' +
        ['1.ª', '2.ª', '3.ª', '4.ª'].map(function(t, i) {
          return '<span><i class="ley-punto" style="background:' + COLORES_VUELTA[i] + '"></i>' + t + '</span>';
        }).join('');

      const rv = hoy / metas.diaria;
      const vueltasHoy = Math.floor(rv);
      $('ritmoHoy').textContent = hoy + ' / ' + metas.diaria + ' min' + (vueltasHoy >= 2 ? ' · ×' + vueltasHoy : '');
      const barraHoy = $('ritmoHoyBar');
      const extraHoy = $('ritmoHoyExtra');
      barraHoy.style.width = Math.min(100, rv * 100) + '%';
      barraHoy.style.background = vueltasHoy >= 1 ? COLORES_VUELTA[(vueltasHoy - 1) % 4] : '';
      extraHoy.style.width = vueltasHoy >= 1 ? Math.round((rv - vueltasHoy) * 100) + '%' : '0%';
      extraHoy.style.background = COLORES_VUELTA[vueltasHoy % 4];
      extraHoy.style.opacity = 1;
      $('ritmoSemana').textContent = formatearMin(semana);
      const r = lsGet('resumenCache', {});
      $('ritmoAnio').textContent = r.anio || new Date().getFullYear();
      $('ritmoLibros').textContent = terminadosAnio() + ' / ' + metas.anual;
      pintarAnillo(elapsedSeconds());
    }

    async function loadResumen() {
      renderRitmo();
      if (!navigator.onLine || !API) return;
      try {
        const r = await apiGet({ action: 'resumen' });
        if (r && r.dias) {
          lsSet('resumenCache', r);
          renderRitmo();
        }
      } catch (e) {}
    }

    // ---- Aviso al terminar un libro ----
    function minutosLibro(titulo) {
      const c = lsGet('metricasCache', {})[titulo];
      const pend = leerCola()
        .filter(x => x.bookTitle.toLowerCase() === titulo.toLowerCase())
        .reduce((a, x) => a + x.minutes, 0);
      return (c ? c.totalMinutes : 0) + pend;
    }

    function mostrarFin(titulo, minSesion) {
      const r = lsGet('resumenCache', {});
      $('finLibro').textContent = '«' + titulo + '»';
      $('finDatos').textContent = 'Esta sesión: ' + formatearMin(minSesion) +
        ' · Total con el cronómetro: ' + formatearMin(minutosLibro(titulo)) +
        '. Llevas ' + terminadosAnio() + ' libros terminados en ' + (r.anio || new Date().getFullYear()) +
        ' (meta: ' + leerMetas().anual + ').';
      try { if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 120]); } catch (e) {}
      $('fin').hidden = false;
      $('finBtn').focus();
    }

    function cerrarFin() { $('fin').hidden = true; }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') cerrarFin(); });

    if (API) iniciar();
  </script>
</body>
</html>
