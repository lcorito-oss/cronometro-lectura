<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cronómetro de Lectura</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <meta name="theme-color" content="#121318">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #121318; transition: opacity .4s; }
#splash.oculto { opacity: 0; pointer-events: none; }
#splash img { width: 96px; height: 96px; border-radius: 22px; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #121318; }
    iframe { width: 100%; height: 100%; border: none; }
    p { color: #e1e2e6; font-family: sans-serif; padding: 24px; line-height: 1.5; }
  </style>
</head>
<body>
  <iframe id="app" title="Cronómetro de lectura"></iframe>
  <div id="splash"><img src="./icon-192.png" alt=""></div>

  <script>
    // La dirección de la aplicación de Apps Script NO está escrita en este archivo público.
    // Se pide una sola vez en cada dispositivo y se guarda ahí (localStorage).
    const CLAVE = 'direccionAppsScript';
    const params = new URLSearchParams(location.search);

    function valida(u) {
      return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u || '');
    }

    // ?reset=1 borra la dirección guardada (por si te equivocaste o cambia la implementación)
    if (params.get('reset')) {
      localStorage.removeItem(CLAVE);
      params.delete('reset');
      const resto = params.toString();
      history.replaceState(null, '', location.pathname + (resto ? '?' + resto : ''));
    }

    let url = localStorage.getItem(CLAVE);
    if (!valida(url)) {
      url = (prompt('Pega la dirección de tu aplicación (termina en /exec):') || '').trim();
      if (valida(url)) {
        localStorage.setItem(CLAVE, url);
      } else {
        url = null;
        document.body.innerHTML = '<p>Falta la dirección de la aplicación.<br>Recarga la página y pégala completa (termina en /exec).</p>';
      }
    }
    if (url) {
      const app = document.getElementById('app');
      const splash = document.getElementById('splash');
      const ocultar = () => splash.classList.add('oculto');

      app.addEventListener('load', () => setTimeout(ocultar, 400));
      setTimeout(ocultar, 8000); // por si la carga se atora

      // Si se abre con ?libro=Titulo, se lo pasa a la aplicación
      const libro = params.get('libro');
      app.src = url + (libro ? '?libro=' + encodeURIComponent(libro) : '');
    }
  </script>
</body>
</html>
